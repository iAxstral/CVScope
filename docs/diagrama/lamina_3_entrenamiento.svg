<text x="1394.6" y="470.6" font-size="13" font-weight="700" fill="#2f9e64" text-anchor="start" dominant-baseline="central">apto</text>
<text x="835.0" y="701.4" font-size="14" font-weight="700" fill="#17203a" text-anchor="start" dominant-baseline="central">Exactitud 0.983 · F1 0.988</text><text x="835.0" y="719.2" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="start" dominant-baseline="central">Nadie le dio el umbral del 66 %: la frontera la aprendió de los datos.</text>
<text x="60.0" y="769.0" font-size="12" font-weight="400" fill="#5c6b8a" text-anchor="start" dominant-baseline="central">Código: red_competitiva/modelo.py y lvq.py  ·  Scripts: entrenar_red_competitiva.py, entrenar_lvq.py, validar_red.py</text>
