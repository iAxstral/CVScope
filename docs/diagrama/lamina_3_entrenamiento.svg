<text x="835.0" y="187.0" font-size="18" font-weight="700" fill="#17203a" text-anchor="start" dominant-baseline="central">Capa LVQ · competitiva y entrenada</text>
<text x="835.0" y="213.0" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="start" dominant-baseline="central">Gana el prototipo más cercano: k* = argmin ‖x − w_k‖ (winner-take-all)</text>
