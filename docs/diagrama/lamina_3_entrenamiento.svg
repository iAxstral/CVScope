<rect x="835.0" y="620.0" width="330.0" height="52.0" rx="12" fill="#e2f4ea"/><text x="1000.0" y="637.4" font-size="13" font-weight="700" fill="#2f9e64" text-anchor="middle" dominant-baseline="central">Acierta → el prototipo se acerca</text><text x="1000.0" y="654.6" font-size="13" font-weight="400" fill="#17203a" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Mono', Consolas, monospace">w ← w + α(x − w)</text>
<rect x="1185.0" y="620.0" width="330.0" height="52.0" rx="12" fill="#fbe3e5"/><text x="1350.0" y="637.4" font-size="13" font-weight="700" fill="#d64550" text-anchor="middle" dominant-baseline="central">Falla → el prototipo se aleja</text><text x="1350.0" y="654.6" font-size="13" font-weight="400" fill="#17203a" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Mono', Consolas, monospace">w ← w − α(x − w)</text>
<text x="60.0" y="57.0" font-size="30" font-weight="700" fill="#17244d" text-anchor="start" dominant-baseline="central">Cómo aprende la red</text>
<text x="60.0" y="97.0" font-size="16" font-weight="400" fill="#5c6b8a" text-anchor="start" dominant-baseline="central">La capa de evaluación aprende de duelos entre hojas de vida; la capa LVQ aprende prototipos de «apto» y «no apto».</text>
<rect x="1300.0" y="42.0" width="240.0" height="32.0" rx="16" fill="#17244d"/><text x="1420.0" y="58.0" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">CVScope · aprendizaje</text>
<text x="85.0" y="187.0" font-size="18" font-weight="700" fill="#17203a" text-anchor="start" dominant-baseline="central">Capa de evaluación · entrenamiento</text>
<text x="85.0" y="213.0" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="start" dominant-baseline="central">Fuera de línea, con retropropagación escrita desde cero en NumPy</text>
<text x="145.0" y="252.4" font-size="15" font-weight="700" fill="#17203a" text-anchor="start" dominant-baseline="central">Dataset de selección</text><text x="145.0" y="270.9" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="start" dominant-baseline="central">240 hojas de vida etiquetadas por rol</text>
<text x="145.0" y="322.4" font-size="15" font-weight="700" fill="#17203a" text-anchor="start" dominant-baseline="central">4.512 duelos dentro de cada rol</text><text x="145.0" y="340.9" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="start" dominant-baseline="central">gana la de mayor puntaje de referencia; empate = 0.5</text>
<text x="145.0" y="392.4" font-size="15" font-weight="700" fill="#17203a" text-anchor="start" dominant-baseline="central">Pérdida por pares</text><text x="145.0" y="410.9" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="start" dominant-baseline="central">P(A gana a B) = σ(s(A) − s(B)) con entropía cruzada</text>
<text x="145.0" y="462.4" font-size="15" font-weight="700" fill="#17203a" text-anchor="start" dominant-baseline="central">Retropropagación</text><text x="145.0" y="480.9" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="start" dominant-baseline="central">Adam + regularización L2 · 40 épocas</text>
<text x="85.0" y="532.0" font-size="15" font-weight="700" fill="#17203a" text-anchor="start" dominant-baseline="central">Prueba con el dataset de ranking (la red nunca lo vio)</text>
<text x="85.0" y="587.0" font-size="13" font-weight="700" fill="#17203a" text-anchor="start" dominant-baseline="central">Exactitud en duelos</text>
<text x="637.4" y="576.0" font-size="12" font-weight="700" fill="#17244d" text-anchor="start" dominant-baseline="central">0.959</text>
