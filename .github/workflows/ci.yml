name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.base_de_datos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base_de_datos: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cvscope
          POSTGRES_PASSWORD: cvscope
          POSTGRES_DB: cvscope
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cvscope"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-*.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: |
          if [ "${{ matrix.base_de_datos }}" = "postgresql" ]; then
            export DATABASE_URL=postgresql://cvscope:cvscope@localhost:5432/cvscope
          fi
          python -m pytest
      - name: Auditoría de sesgos
        run: python scripts/auditar_sesgos.py

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Pruebas de punta a punta (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-*.txt
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: frontend/playwright-report
          retention-days: 7
